name: Full ScrapeX regression

on:
  push:
    branches:
      - fix/ymm-target-signal-regression-20260914

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
          mkdir -p "$HOME/bin"
          ln -sf "$(command -v pwsh)" "$HOME/bin/powershell.exe"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Full ScrapeX suite
        run: python -m pytest -q
      - name: Compile changed modules
        run: |
          python -m compileall -q \
            scrapex/navigator_vehicle_identity.py \
            scrapex/navigator_vehicle_signal_compat.py \
            scrapex/alldata_navigator.py
