name: Agentic SI validation
on:
  push:
    branches:
      - agentic-si-navigator-20260907

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ScrapeX
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Test Navigator
        run: |
          python -m pytest -q
          python -m compileall -q scrapex
