name: Shared VIN policy validation

on:
  push:
    branches:
      - fix/ro-identity-allows-shared-vin-20260915

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ro-identity-allows-shared-vin-20260915
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Version vehicle reconciliation idempotency
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scrapex/ciq.py",
              '''            identity = {\n                "operation": "update_ro",\n                "repair_order_id": repair_order_id,\n                "expected_version": ro_version,\n                "arguments": vehicle_changes,\n                "inspection_id": inspection_id,\n            }\n''',
              '''            identity = {\n                "reconciliation_contract_version": RECONCILIATION_CONTRACT_VERSION,\n                "operation": "update_ro",\n                "repair_order_id": repair_order_id,\n                "expected_version": ro_version,\n                "arguments": vehicle_changes,\n                "inspection_id": inspection_id,\n            }\n''',
          )
          replace_once(
              "tests/test_ciq_reconciliation.py",
              '''from scrapex.ciq import CIQClient, CIQReconciliationError, calibration_key\n''',
              '''from scrapex.ciq import (\n    RECONCILIATION_CONTRACT_VERSION,\n    CIQClient,\n    CIQReconciliationError,\n    calibration_key,\n)\n''',
          )
          replace_once(
              "tests/test_ciq_reconciliation.py",
              '''    assert result["vehicle_changed"]["mutation_id"] == "mutation-1"\n\n\n@pytest.mark.asyncio\nasync def test_live_map_configuration_is_merged_without_clobbering_ro_configuration():\n''',
              '''    assert result["vehicle_changed"]["mutation_id"] == "mutation-1"\n    expected_identity = {\n        "reconciliation_contract_version": RECONCILIATION_CONTRACT_VERSION,\n        "operation": "update_ro",\n        "repair_order_id": "ro-1",\n        "expected_version": 4,\n        "arguments": update["arguments"],\n        "inspection_id": "9900001",\n    }\n    legacy_identity = {key: value for key, value in expected_identity.items() if key != "reconciliation_contract_version"}\n    assert update["idempotency_key"] == client._idempotency(expected_identity)\n    assert update["idempotency_key"] != client._idempotency(legacy_identity)\n\n\n@pytest.mark.asyncio\nasync def test_live_map_configuration_is_merged_without_clobbering_ro_configuration():\n''',
          )
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
          if command -v pwsh >/dev/null 2>&1; then sudo ln -sf "$(command -v pwsh)" /usr/local/bin/powershell.exe; fi
      - name: Full ScrapeX test suite
        run: python -m pytest -q
      - name: Compile touched modules
        run: python -m compileall -q scrapex/ciq.py tests/test_ciq_reconciliation.py
      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scrapex/ciq.py tests/test_ciq_reconciliation.py
          git commit -m "Version corrected VIN reconciliation mutations [skip ci]"
          git push origin HEAD:fix/ro-identity-allows-shared-vin-20260915
