name: YMM identity validation

on:
  push:
    branches:
      - fix/ymm-identity-proof-20260914

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Vehicle identity and Navigator suites
        run: |
          python -m pytest -q \
            tests/test_navigator_vehicle_identity.py \
            tests/test_alldata_navigator_fastpath.py \
            tests/test_navigator_binding.py \
            tests/test_navigator_http_api.py
      - name: Compile changed modules
        run: |
          python -m compileall -q \
            scrapex/navigator_vehicle_identity.py \
            scrapex/alldata_navigator.py \
            scrapex/navigator_actions.py \
            scrapex/navigator_worker.py
