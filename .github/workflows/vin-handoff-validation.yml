name: ADAS Map VIN handoff validation

on:
  push:
    branches:
      - fix/adas-map-vin-handoff-20260915

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: ADAS Map identity and reconciliation regression suites
        run: |
          python -m pytest -q \
            tests/test_adas_map_vin_backfill.py \
            tests/test_adas_map_runner.py \
            tests/test_ciq_reconciliation.py \
            tests/test_main_api.py
      - name: Compile changed package
        run: |
          python -m compileall -q scrapex
